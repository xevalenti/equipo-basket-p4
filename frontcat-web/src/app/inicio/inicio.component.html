<div class="container">
  <div class="header">
    <h1>Equipo Basket P2</h1>
    <div class="actions">
      <button class="btn-nav" (click)="irAVideos()">📺 Ver Videos</button>
      <button class="btn-add" (click)="nuevoJugador()">+ Nuevo Jugador</button>
    </div>
  </div>

  <div class="list">
    <div class="player-card" *ngFor="let player of players$ | async" (click)="verDetalles(player)">
      <div class="avatar">
        <img *ngIf="player.headshotBase64" [src]="'data:image/jpeg;base64,' + player.headshotBase64" alt="Photo">
        <div *ngIf="!player.headshotBase64" class="no-photo">{{ player.initials }}</div>
      </div>

      <div class="info">
        <p class="name">{{ player.name }} {{ player.lastName }}</p>
        <p class="meta">#{{ player.alias }} | {{ player.position }}</p>
      </div>

      <button class="btn-edit" (click)="editarJugador($event, player)">✏️</button>
    </div>
  </div>
</div>
