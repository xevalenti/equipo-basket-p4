<div class="wrap" *ngIf="player">
  <div class="header">
    <h2>{{ player.name }} {{ player.lastName }}</h2>
    <button class="btn-home" (click)="irAInicio()">Inicio</button>
  </div>

  <div class="top">
    <div class="image-container">
      <img *ngIf="headshotSrc" [src]="headshotSrc" class="headshot" alt="Player Photo">
      <div *ngIf="!headshotSrc" class="headshot placeholder">
        <span>No image</span>
      </div>
    </div>

    <div class="info">
      <p class="name">{{ player.name }} {{ player.lastName }}</p>
      <p><strong>Dorsal:</strong> #{{ player.alias }}</p>
      <p><strong>Edad:</strong> {{ player.age }} años</p>
      <p><strong>Altura:</strong> {{ player.height }}</p>
      <p><strong>Peso:</strong> {{ player.weight }}</p>
      <p><strong>Posición:</strong> {{ player.position }}</p>
      <p><strong>Equipo:</strong> {{ player.initials }}</p>
    </div>
  </div>

  <div class="actions">
    <button class="btn-video" (click)="verVideo()">🎥 Ver vídeo</button>
  </div>
</div>
